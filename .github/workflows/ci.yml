name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (writes JSON test summary)
        run: npm run test:ci
      - run: npm run build

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: app/test-results.json
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist

  release-bundle:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create GitHub Releases on tags
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app/dist

      - uses: actions/download-artifact@v4
        with:
          name: test-summary
          path: app

      - name: Collect pull requests and reviews for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | {number, title, body, user: .user.login, merged_at, html_url}]' > prs.json || echo '[]' > prs.json
          for n in $(jq -r '.[].number' prs.json); do
            gh api "repos/${{ github.repository }}/pulls/$n/reviews" \
              --jq "[.[] | {pr: $n, reviewer: .user.login, state, submitted_at}]"
          done | jq -s 'add // []' > reviews.json

      - name: Build release bundle
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/build-release-bundle.mjs

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            release-bundle/*.tar.gz
            release-bundle/manifest.json

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-bundle/*.tar.gz release-bundle/manifest.json \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Notify webhook (optional)
        env:
          CASEVU_WEBHOOK_URL: ${{ secrets.CASEVU_WEBHOOK_URL }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CASEVU_WEBHOOK_URL" ] || [ -z "$CI_WEBHOOK_SECRET" ]; then
            echo "Webhook secrets not configured; skipping."
            exit 0
          fi
          sig=$(openssl dgst -sha256 -hmac "$CI_WEBHOOK_SECRET" -hex < release-bundle/manifest.json | sed 's/^.* //')
          curl --fail-with-body -sS -X POST "$CASEVU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-CaseVu-Signature: sha256=$sig" \
            --data-binary @release-bundle/manifest.json
