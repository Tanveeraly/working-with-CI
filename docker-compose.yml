services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casevu
      POSTGRES_PASSWORD: casevu
      POSTGRES_DB: casevu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casevu"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://casevu:casevu@db:5432/casevu
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
